<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTL Premium Lernapp - Ultimate Edition</title>
    <style>
        :root {
            --bg-dark: #07080a;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
            --glass-border: rgba(102, 252, 241, 0.25);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.05);
            --text-main: #e2e2e5;
            --primary: #45a29e;
            --primary-glow: rgba(69, 162, 158, 0.7);
            --accent: #66fcf1;
            --correct: #32d74b;
            --wrong: #ff453a;
            --gold: #ffd700;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(69, 162, 158, 0.2) 0px, transparent 50%),
                radial-gradient(circle at 85% 90%, rgba(102, 252, 241, 0.15) 0px, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(191, 90, 242, 0.08) 0px, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        .nav-bar { width: 100%; max-width: 700px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; z-index: 10; }
        .nav-right { display: flex; gap: 10px; }
        .nav-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(20px);
            color: white; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; 
            transition: transform 0.3s, background 0.3s, border-color 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .nav-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); border-color: var(--accent); }
        .nav-btn-print { border-color: var(--accent); color: var(--accent); background: rgba(102, 252, 241, 0.05); }

        .container {
            background: var(--glass-bg);
            border: 1px solid rgba(255,255,255,0.15); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            box-shadow: var(--glass-shadow); border-radius: 28px; max-width: 700px; width: 100%; padding: 30px;
            margin-bottom: 20px; animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; position: relative; z-index: 2;
        }
        
        @keyframes floatUp { 
            from { opacity: 0; transform: translateY(40px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        h1 { font-size: 30px; text-align: center; margin-top: 0; color: #fff; text-shadow: 0 0 15px rgba(102,252,241,0.4); letter-spacing: 0.5px; }
        h2 { font-size: 20px; margin-bottom: 15px; color: var(--accent); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-top: 25px; }
        h3 { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; color: #fff; }

        .topic-row {
            display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.35); 
            padding: 14px 20px; border-radius: 18px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.3s ease;
        }
        .topic-row:hover { background: rgba(0,0,0,0.5); border-color: var(--accent); transform: translateX(4px); box-shadow: -4px 4px 15px rgba(0,0,0,0.2); }
        .topic-row label { cursor: pointer; display: flex; align-items: center; width: 100%; color: #fff; font-weight: 500; font-size: 15px; }
        .topic-row input { margin-right: 15px; transform: scale(1.4); accent-color: var(--accent); cursor: pointer; }
        
        .grade-badge {
            position: relative; font-weight: 800; padding: 6px 16px; border-radius: 12px; font-size: 15px; min-width: 85px; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-shadow: 1px 1px 2px rgba(0,0,0,0.5); color: #fff;
        }
        .grade-1 { background: linear-gradient(135deg, #32d74b, #28a745); }
        .grade-2 { background: linear-gradient(135deg, #8dc63f, #5c9e10); }
        .grade-3 { background: linear-gradient(135deg, #ffc107, #d39e00); }
        .grade-4 { background: linear-gradient(135deg, #fd7e14, #d9640b); }
        .grade-5 { background: linear-gradient(135deg, #ff453a, #c92a21); }
        .grade-none { background: rgba(255,255,255,0.08); color: #888; box-shadow: none; border: 1px solid rgba(255,255,255,0.1); }

        @keyframes particle-anim {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
        .confetti-particle {
            position: absolute; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; z-index: 10;
            animation: particle-anim 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 25px; }
        
        .action-btn {
            background: linear-gradient(135deg, var(--primary), #2b6b68); color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 16px; border-radius: 18px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; 
            box-shadow: 0 8px 20px var(--primary-glow); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .action-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 25px var(--primary-glow); border-color: var(--accent); }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 4px 10px var(--primary-glow); }
        
        .btn-stats { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.3); color: var(--accent); }
        .btn-stats:hover { background: rgba(255,255,255,0.15); box-shadow: 0 8px 20px rgba(102,252,241,0.2); }

        .btn-test { background: linear-gradient(135deg, #bf5af2, #8e30bd); border-color: rgba(191,90,242,0.5); box-shadow: 0 8px 20px rgba(191,90,242,0.4); }
        .btn-test:hover { box-shadow: 0 12px 25px rgba(191,90,242,0.6); }
        
        .btn-error { background: linear-gradient(135deg, #ff453a, #b3251e); border-color: rgba(255,69,58,0.5); box-shadow: 0 8px 20px rgba(255,69,58,0.4); }
        .btn-error:hover { box-shadow: 0 12px 25px rgba(255,69,58,0.6); }
        .btn-error:disabled { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: #555; cursor: not-allowed; box-shadow: none; transform: none; filter: none; }
        
        .btn-reset { background: rgba(255,69,58,0.1); border-color: var(--wrong); color: var(--wrong); box-shadow: none; text-transform: none; font-size: 14px; padding: 12px; margin-top: 30px; }
        .btn-reset:hover { background: rgba(255,69,58,0.2); box-shadow: 0 0 15px rgba(255,69,58,0.4); border-color: var(--wrong); }

        .override-btn { background: rgba(50, 215, 75, 0.1); border: 1px solid rgba(50, 215, 75, 0.3); box-shadow: none; margin-bottom: 12px; color: var(--correct); text-transform: none; }
        .override-btn:hover { background: rgba(50, 215, 75, 0.2); border-color: var(--correct); box-shadow: 0 0 20px rgba(50,215,75,0.4); }

        textarea, .match-select {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px;
            color: white; padding: 16px; font-size: 16px; margin-top: 10px; transition: all 0.3s; resize: vertical; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        textarea:focus, .match-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 15px rgba(102,252,241,0.3), inset 0 2px 10px rgba(0,0,0,0.5); }
        
        .option-label {
            display: flex; align-items: center; background: rgba(0,0,0,0.35); padding: 16px 20px; margin: 10px 0;
            border-radius: 14px; cursor: pointer; border: 1px solid rgba(255,255,255,0.08); transition: all 0.25s ease; color: #fff; font-size: 15px;
        }
        .option-label:hover { background: rgba(102,252,241,0.1); border-color: var(--accent); transform: translateX(6px); box-shadow: -4px 4px 15px rgba(0,0,0,0.2); }
        input[type="radio"] { margin-right: 15px; transform: scale(1.4); accent-color: var(--accent); cursor: pointer; }

        .inline-input { background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: #fff; padding: 8px 12px; font-size: 16px; width: 140px; text-align: center; margin: 0 5px; transition: 0.3s; }
        .inline-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 10px rgba(102,252,241,0.3); }
        
        .match-row { display: flex; flex-direction: column; background: rgba(0,0,0,0.4); padding: 16px; margin: 10px 0; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); }
        .match-term { font-weight: bold; color: var(--accent); margin-bottom: 8px; font-size: 15px; letter-spacing: 0.5px; }

        .feedback { margin-top: 25px; padding: 22px; border-radius: 18px; background: rgba(0,0,0,0.6); border-left: 6px solid var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }

        .live-stats-bar { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 14px 22px; border-radius: 18px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 2px 10px rgba(0,0,0,0.3); }
        .live-stat-item { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        
        .mode-badge { font-size: 12px; background: var(--accent); color: #000; padding: 4px 12px; border-radius: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 2px 10px rgba(102,252,241,0.3); }

        .chart-container { position: relative; width: 180px; height: 180px; border-radius: 50%; margin: 30px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(0,0,0,0.6); background: conic-gradient(rgba(255,255,255,0.1) 100%); transition: background 1s cubic-bezier(0.1, 0.8, 0.3, 1); }
        .chart-center { width: 130px; height: 130px; background: var(--bg-dark); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 32px; z-index: 2; box-shadow: inset 0 0 25px rgba(0,0,0,0.8); color: #fff; }
        
        .mini-topic-chart { width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .mini-topic-chart::after { content: ""; width: 48px; height: 48px; background: #1a1c23; border-radius: 50%; position: absolute; box-shadow: inset 0 0 8px rgba(0,0,0,0.6); }

        .hover-scale { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease; }
        .hover-scale:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 25px rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.2); }

        .hidden { display: none !important; }
        .text-green { color: var(--correct); text-shadow: 0 0 8px rgba(50,215,75,0.4); }
        .text-red { color: var(--wrong); text-shadow: 0 0 8px rgba(255,69,58,0.4); }
    </style>
</head>
<body>

    <div class="nav-bar">
        <div id="left-nav">
            <button class="nav-btn nav-btn-print hidden" id="print-btn" onclick="printTest()">🖨️ Ausdrucken</button>
        </div>
        <div class="nav-right">
            <button class="nav-btn" onclick="goHome()">🏠 Startmenü</button>
            <button class="nav-btn" id="pause-btn" onclick="togglePause()">⏸️💾 Pause & Speichern</button>
        </div>
    </div>

    <!-- START VIEW -->
    <div id="start-view" class="container">
        <h1>⚙️ Fertigungstechnik Trainer</h1>
        
        <h2>Themen & Noten</h2>
        <div id="topics-container">
            <!-- Dynamisch gefüllt -->
        </div>
        
        <div class="btn-grid">
            <button class="action-btn" onclick="startQuiz('normal')">🚀 Normales Quiz (Auswahl)</button>
            <button class="action-btn btn-test" onclick="startQuiz('test')">📝 Prüfungsmodus (30 Fragen)</button>
            <button class="action-btn btn-error" id="btn-error-mode" onclick="startQuiz('error')">🔥 Fehler-Wiederholung (<span id="error-count">0</span>)</button>
            <button class="action-btn btn-stats" onclick="showStatsMenu()">📊 Detaillierte Statistiken</button>
        </div>
    </div>

    <!-- STATS VIEW -->
    <div id="stats-view" class="container hidden">
        <h1>📊 Gesamtstatistik</h1>
        
        <div class="chart-container" id="global-donut">
            <div class="chart-center">
                <span id="global-pct">0%</span>
                <span style="font-size: 13px; color: #a0a0b8; font-weight: 600; text-transform: uppercase; margin-top: 2px;">Richtig</span>
            </div>
        </div>

        <div style="display: flex; justify-content: space-around; margin-bottom: 30px; background: rgba(0,0,0,0.4); padding: 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);">
            <div style="text-align: center;"><div id="stat-total-q" style="font-size: 24px; font-weight: 800;">0</div><div style="font-size: 12px; color: #a0a0b8; text-transform: uppercase; font-weight: 600;">Beantwortet</div></div>
            <div style="text-align: center;"><div id="stat-total-c" class="text-green" style="font-size: 24px; font-weight: 800;">0</div><div style="font-size: 12px; color: #a0a0b8; text-transform: uppercase; font-weight: 600;">Richtig</div></div>
            <div style="text-align: center;"><div id="stat-total-w" class="text-red" style="font-size: 24px; font-weight: 800;">0</div><div style="font-size: 12px; color: #a0a0b8; text-transform: uppercase; font-weight: 600;">Falsch</div></div>
        </div>

        <h2>Themenübersicht</h2>
        <div id="stats-topics-list">
            <!-- Dynamisch gefüllt -->
        </div>

        <button class="action-btn" onclick="goHome()" style="margin-top: 20px;">🔙 Zurück zum Start</button>
        <button class="action-btn btn-reset" onclick="resetApp()">🗑️ Alle Daten löschen (App komplett zurücksetzen)</button>
    </div>

    <!-- QUIZ VIEW -->
    <div id="quiz-view" class="container hidden">
        <div class="live-stats-bar">
            <div style="display: flex; gap: 20px; align-items: center;">
                <span class="live-stat-item text-green">✅ <span id="live-correct">0</span></span>
                <span class="live-stat-item text-red">❌ <span id="live-wrong">0</span></span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="quiz-mode-label" class="mode-badge">NORMAL</span>
                <span id="progress" style="color: #fff; font-size: 15px; font-weight: bold;"></span>
            </div>
        </div>

        <span id="question-topic" style="color: var(--accent); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;"></span>
        <h3 id="question-text" style="margin-top: 8px;"></h3>
        
        <div id="input-area"></div>
        
        <button id="check-btn" class="action-btn" onclick="checkAnswer()">Antwort Überprüfen</button>

        <div id="feedback-area" class="feedback hidden">
            <h3 id="feedback-title" style="margin-top: 0; font-size: 22px; text-shadow: 0 0 10px rgba(0,0,0,0.5);"></h3>
            <p id="feedback-text" style="font-size: 16px; line-height: 1.6; color: #fff;"></p>
            <button id="override-btn" class="action-btn override-btn hidden" onclick="overrideCorrect()">Ich lag inhaltlich trotzdem richtig!</button>
            <button class="action-btn" onclick="nextQuestion()">Weiter ➔</button>
        </div>
    </div>

    <!-- END VIEW -->
    <div id="end-view" class="container hidden">
        <h2 style="text-align: center; border: none; font-size: 28px; margin-top: 0;" id="end-title">Auswertung</h2>
        
        <div style="text-align: center; margin: 25px 0;">
            <div id="final-grade-badge" class="grade-badge grade-none" style="font-size: 36px; padding: 18px 35px; display: inline-block; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">Note: -</div>
            <h1 id="final-score" style="font-size: 42px; margin: 0; color: white; text-shadow: 0 0 20px rgba(255,255,255,0.3);"></h1>
            <p id="final-pct" style="color: var(--accent); font-weight: 800; font-size: 24px; margin-top: 8px; text-shadow: 0 0 10px rgba(102,252,241,0.4);"></p>
        </div>
        
        <p id="final-message" style="text-align: center; color: #fff; margin-bottom: 30px; font-size: 18px; font-weight: 600; background: rgba(0,0,0,0.4); padding: 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);"></p>
        
        <button class="action-btn" onclick="location.reload()">Abschließen & Zurück</button>
    </div>

<script>
    const rawQuestions = [
        { topic: "Schweißen", type: "text", q: "Frage 1: Welche drei Schweißverfahren werden im Video als die wichtigsten für Hobby- und Profibereich vorgestellt?", a: "MSG-Schweißen (MIG/MAG), WIG-Schweißen und das E-Hand-Schweißen." },
        { topic: "Schweißen", type: "text", q: "Frage 2: Erkläre den Unterschied zwischen den Bezeichnungen „MIG\", „MAG\" und „MSG\". Wofür stehen die Abkürzungen?", a: "MSG steht für Metall-Schutzgasschweißen (Oberbegriff). MIG nutzt inerte (reaktionslose) Gase, MAG nutzt aktive (reaktionsfreudige) Gase." },
        { topic: "Schweißen", type: "text", q: "Frage 3: Wofür steht die Abkürzung „WIG\" und welcher englische Begriff (TIG) wird gleichbedeutend verwendet? Übersetze beide.", a: "WIG = Wolfram-Inertgasschweißen. TIG = Tungsten Inert Gas (Tungsten bedeutet Wolfram)." },
        { topic: "Schweißen", type: "text", q: "Frage 4: Was bedeutet die Abkürzung „E-Hand\" bzw. „MMA\"? Beschreibe den Verfahrensnamen vollständig.", a: "E-Hand = Lichtbogenhandschweißen. MMA = Manual Metal Arc welding." },
        { topic: "Schweißen", type: "text", q: "Frage 5: Welche Aufgabe hat das Schutzgas beim Schweißen und warum ist es notwendig?", a: "Es verdrängt den Umgebungssauerstoff vollständig, um Porenbildung und Oxidation im flweißbad zu verhindern." },
        { topic: "Schweißen", type: "text", q: "Frage 6: Nenne typische Schutzgase für MIG- und MAG-Schweißen und erkläre, warum sie unterschiedlich heißen.", a: "MIG: Reines Argon oder Helium (inert). MAG: Argon-CO2-Gemisch oder reines CO2 (aktiv, da das Gas aktiv chemisch reagiert)." },
        { topic: "Schweißen", type: "text", q: "Frage 7: Wie funktioniert das MAG-Schweißen prinzipiell? Beschreibe in eigenen Worten.", a: "Eine Drahtelektrode wird kontinuierlich per Motor durch das Schlauchpaket gefördert. Sie schmilzt im Lichtbogen auf und liefert gleichzeitig den Zusatzwerkstoff unter strömendem Schutzgas." },
        { topic: "Schweißen", type: "text", q: "Frage 8: Welche Aufgabe hat der Schweißdraht (Drahtelektrode) beim MAG-Schweißen?", a: "Er dient als stromführende Elektrode zur Zündung des Lichtbogens und schmilzt als eigentliches Zusatzmaterial abschmilzt." },
        { topic: "Schweißen", type: "text", q: "Frage 9: Für welche Materialien (Werkstoffe) eignet sich das MAG-Schweißen besonders gut?", a: "Vor allem für unlegierte und niedriglegierte Stähle (klassischer Baustahl) sowie dünne Karosseriebleche." },
        { topic: "Schweißen", type: "text", q: "Frage 10: Welche Vorteile bietet das MAG-Verfahren gegenüber den anderen Verfahren?", a: "Sehr hohe Abschmelzleistung, hohe Arbeitsgeschwindigkeit, einhändige Führung und eine flache Lernkurve für Einsteiger." },
        { topic: "Schweißen", type: "text", q: "Frage 11: Welche Nachteile oder Einschränkungen hat das MAG-Schweißen?", a: "Extrem windanfällig (nicht für Außeneinsatz), unhandliche Gasflaschen und Neigung zu Schweißspritzern." },
        { topic: "Schweißen", type: "text", q: "Frage 12: Was versteht man unter „Fülldrahtschweißen\" und worin liegt der Unterschied zum klassischen MAG-Schweißen?", a: "Es wird ein hohler Draht mit Pulverfüllung genutzt. Das abbrennende Pulver erzeugt die Schutzgasatmosphäre direkt, weshalb keine externe Gasflasche benötigt wird." },
        { topic: "Schweißen", type: "text", q: "Frage 13: Beschreibe den prinzipiellen Aufbau des WIG-Schweißens: Welche Elektrode wird verwendet?", a: "Es wird eine nicht abschmelzende Elektrode aus reinem oder legiertem Wolfram verwendet. Bei MAG schmilzt die Elektrode selbst ab." },
        { topic: "Schweißen", type: "text", q: "Frage 14: Welches Schutzgas wird beim WIG-Schweißen verwendet? Warum eignet sich gerade dieses Gas?", a: "Ausschließlich reines Argon (Inertgas). Es reagiert selbst bei extremen Temperaturen nicht mit der empfindlichen Wolframnadel oder der Schmelze." },
        { topic: "Schweißen", type: "text", q: "Frage 15: Wie wird beim WIG-Schweißen der Zusatzwerkstoff zugeführt?", a: "Der Zusatzwerkstoff wird manuell als separater Stab mit der freien Hand tröpfchenweise in den Lichtbogen getupft, statt maschinell gefördert zu werden." },

        { topic: "Schweißen", type: "text", q: "Frage 17: Nenne mindestens drei Vorteile und zwei Nachteile des WIG-Schweißens.", a: "Vorteile: Perfekte saubere Nahtoptik, absolut spritzerfrei, universell für fast alle Metalle. Nachteile: Extrem langsame Arbeitsgeschwindigkeit, hoher Anschaffungspreis." },

    let errorPool = JSON.parse(localStorage.getItem('htl_ErrorPool')) || [];

    availableTopics.forEach(t => {
        if(!topicStats[t]) topicStats[t] = { correct: 0, total: 0 };
    });

    function getAustrianGrade(pct) {
        if(pct >= 89) return 1;
        if(pct >= 76) return 2;
        if(pct >= 63) return 3;
        if(pct >= 50) return 4;
        return 5;
    }

    function burstConfetti(el) {
        const rect = el.getBoundingClientRect();
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'confetti-particle';
            p.style.backgroundColor = ['#66fcf1', '#32d74b', '#ffd700', '#bf5af2', '#ff453a'][Math.floor(Math.random() * 5)];
            
            p.style.left = `${rect.left + rect.width / 2}px`;
            p.style.top = `${rect.top + rect.height / 2}px`;
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 60 + 20;
            p.style.setProperty('--dx', `${Math.cos(angle) * velocity}px`);
            p.style.setProperty('--dy', `${Math.sin(angle) * velocity}px`);
            
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }
    }

    function renderStartScreen() {
        const container = document.getElementById('topics-container');
        container.innerHTML = '';
        
        availableTopics.forEach(t => {
            const stats = topicStats[t];
            let pct = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : -1;
            let grade = pct >= 0 ? getAustrianGrade(pct) : '-';
            let gradeClass = pct >= 0 ? `grade-${grade}` : 'grade-none';
            
            let upgraded = false;
            if (lastGrades[t] && lastGrades[t] !== '-' && grade !== '-' && grade < lastGrades[t]) {
                upgraded = true;
            }
            lastGrades[t] = grade;

            const badgeId = `badge-${t.replace(/\s+/g, '-')}`;
            
            container.innerHTML += `
                <div class="topic-row">
                    <label><input type="checkbox" class="topic-cb" value="${t}" checked> ${t} (${allQuestions.filter(q=>q.topic===t).length} Fragen)</label>
                    <div id="${badgeId}" class="grade-badge ${gradeClass}">Note: ${grade}</div>
                </div>
            `;

            if (upgraded) {
                setTimeout(() => {
                    const el = document.getElementById(badgeId);
                    if(el) burstConfetti(el);
                }, 150);
            }
        });

        document.getElementById('error-count').innerText = errorPool.length;
        document.getElementById('btn-error-mode').disabled = errorPool.length === 0;
    }

    function showStatsMenu() {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById('stats-view').classList.remove('hidden');

        let totalQ = 0, totalC = 0;
        let topicsHtml = '';

        availableTopics.forEach(t => {
            const stats = topicStats[t];
            totalQ += stats.total;
            totalC += stats.correct;

            let pct = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
            let grade = stats.total > 0 ? getAustrianGrade(pct) : '-';
            let gradeClass = stats.total > 0 ? `grade-${grade}` : 'grade-none';
            
            let feedback = "Noch keine Daten gesammelt.";
            if(stats.total > 0) {
                if(grade === 1) feedback = "Meisterhaftes Level! 🚀";
                else if(grade === 2) feedback = "Sehr solides Wissen! 👍";
                else if(grade === 3) feedback = "Auf dem richtigen Weg, aber da geht noch was. 🤔";
                else if(grade === 4) feedback = "Achtung, dein Wissen ist hier wackelig! ⚠️";
                else feedback = "Dringend nachholen! ❌";
            }

            topicsHtml += `
            <div class="hover-scale" style="display:flex; align-items:center; background:rgba(0,0,0,0.4); padding:16px; border-radius:18px; margin-bottom:14px; border:1px solid rgba(255,255,255,0.08);">
                <div class="mini-topic-chart" style="background: conic-gradient(var(--correct) 0% ${pct}%, var(--wrong) ${pct}% 100%)">
                    <span style="position:absolute; font-size:13px; font-weight:800; z-index:5; text-shadow: 0 0 5px rgba(0,0,0,0.8);">${pct}%</span>
                </div>
                <div style="margin-left: 18px; flex-grow: 1;">
                    <div style="font-weight:800; color:var(--accent); font-size:16px; letter-spacing: 0.5px;">${t}</div>
                    <div style="font-size:14px; color:var(--text-main); font-weight: 500;">${stats.correct} von ${stats.total} richtig</div>
                    <div style="font-size:13px; color:#a0a0b8; margin-top:5px; font-style: italic;">${feedback}</div>
                </div>
                <div class="grade-badge ${gradeClass}" style="margin-left:12px; font-size: 14px; padding: 6px 12px;">Note: ${grade}</div>
            </div>`;
        });

        document.getElementById('stats-topics-list').innerHTML = topicsHtml;

        let globalPct = totalQ > 0 ? Math.round((totalC / totalQ) * 100) : 0;
        document.getElementById('global-pct').innerText = `${globalPct}%`;
        document.getElementById('global-donut').style.background = `conic-gradient(var(--correct) 0% ${globalPct}%, var(--wrong) ${globalPct}% 100%)`;
        
        document.getElementById('stat-total-q').innerText = totalQ;
        document.getElementById('stat-total-c').innerText = totalC;
        document.getElementById('stat-total-w').innerText = totalQ - totalC;
    }

    function resetApp() {
        if(confirm("🚨 ACHTUNG: Möchtest du wirklich alle Daten löschen?\n\nDeine Noten, Statistiken und dein Fehlerpool gehen komplett und unwiderruflich verloren!")) {
            localStorage.removeItem('htl_TopicStats');
            localStorage.removeItem('htl_ErrorPool');
            location.reload();
        }
    }

        <body>
            <h1>Prüfung: Fertigungstechnik</h1>
            <div class="header">
                <div>Name: __________________________</div>
                <div>Klasse: ________</div>
                <div>Datum: ________</div>
            </div>
        `;

        // Alle Fragen ausdrucken (inkl. Freitext-Aufgaben mit leeren Linien)
        printableQuestions.forEach((q, idx) => {
            html += `<div class="q-box"><div class="q-title">${idx + 1}. ${q.q} <span class="topic-tag">(${q.topic})</span></div>`;
            
            if(q.type === 'mc') {
                q.options.forEach(opt => html += `<div class="opt">&#9711; ${opt}</div>`); 
            } else if(q.type === 'tf') {
                html += `<div class="opt">&#9711; Wahr &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &#9711; Falsch</div>`;
            } else if(q.type === 'luecke') {
                html += `<div class="opt" style="line-height: 2.5;">${q.parts[0]} <span class="luecke-line"></span> ${q.parts[1]} <span class="luecke-line"></span> ${q.parts[2]} <span class="luecke-line"></span>.</div>`;
            } else if(q.type === 'zuordnung') {
                html += `<div style="display:flex; justify-content:space-between; max-width: 650px; margin-top: 15px;"><div>`;

                q.options.forEach((o,i) => { if(i>0) html += `<div class="opt">${i}) ${o}</div>`; });
                html += `</div></div>`;
            } else if(q.type === 'text') {
                // Generiert Linien für Textaufgaben zum Reinschreiben
                html += `<div class="opt write-lines"><div class="write-line"></div><div class="write-line"></div><div class="write-line"></div></div>`;
            }
            html += `</div>`;
        });
        
        // LÖSUNGSBLATT am Ende
        html += `
            <div class="page-break">
                <h1>Lösungsblatt (Fertigungstechnik)</h1>
                <div style="margin-top: 30px;">
        `;
        
        printableQuestions.forEach((q, idx) => {

    function startQuiz(mode) {
        quizMode = mode;
        activeQuestions = [];
        
        if (mode === 'test') {
            document.getElementById('print-btn').classList.remove('hidden');
        } else {
            document.getElementById('print-btn').classList.add('hidden');
        }
        
        if (mode === 'normal') {
            const selected = Array.from(document.querySelectorAll('.topic-cb:checked')).map(cb => cb.value);
            if(!selected.length) { alert("Wähle mindestens ein Thema!"); return; }
            activeQuestions = allQuestions.filter(q => selected.includes(q.topic));
            document.getElementById('quiz-mode-label').innerText = "NORMAL";
            document.getElementById('quiz-mode-label').style.background = "var(--primary)";
        } 
        else if (mode === 'test') {
            // Hier passiert die Zufalls-Auswahl der 30 Fragen!
            activeQuestions = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, 30);
            document.getElementById('quiz-mode-label').innerText = "TEST (30)";
            document.getElementById('quiz-mode-label').style.background = "#bf5af2";
        }
        else if (mode === 'error') {
            activeQuestions = allQuestions.filter(q => errorPool.includes(q.id));
            if(!activeQuestions.length) return;
            document.getElementById('quiz-mode-label').innerText = "FEHLER-POOL";
            document.getElementById('quiz-mode-label').style.background = "var(--wrong)";
        }

        if (mode !== 'test') {
             activeQuestions = activeQuestions.sort(() => Math.random() - 0.5);
        }
        
        currentQIndex = 0; score = 0; wrongAns = 0; pausedState = null;

        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById('quiz-view').classList.remove('hidden');
        
        updateLiveStats(); renderQuestion();
    }

    function updateLiveStats() {
        document.getElementById('live-correct').innerText = score;
        document.getElementById('live-wrong').innerText = wrongAns;
    }

    function renderQuestion() {
        const q = activeQuestions[currentQIndex];
        document.getElementById('progress').innerText = `Frage ${currentQIndex + 1} / ${activeQuestions.length}`;
        document.getElementById('question-topic').innerText = q.topic;
        document.getElementById('question-text').innerText = q.q;
        
        const area = document.getElementById('input-area'); area.innerHTML = '';
        document.getElementById('check-btn').classList.remove('hidden');
        document.getElementById('feedback-area').classList.add('hidden');

        if (q.type === 'mc') {
            q.options.forEach((opt, i) => area.innerHTML += `<label class="option-label"><input type="radio" name="ans" value="${i}"> ${opt}</label>`);
        } else if (q.type === 'tf') {
            ['Wahr', 'Falsch'].forEach(opt => area.innerHTML += `<label class="option-label"><input type="radio" name="ans" value="${opt}"> ${opt}</label>`);
        } else if (q.type === 'text') {
            area.innerHTML = `<textarea id="txt-ans" rows="4" placeholder="Deine Antwort..."></textarea>`;
        } else if (q.type === 'luecke') {
            area.innerHTML = `<p style="line-height:2.6; font-size:16px;">${q.parts[0]}<input class="inline-input" id="g0">${q.parts[1]}<input class="inline-input" id="g1">${q.parts[2]}<input class="inline-input" id="g2">.</p>`;
        } else if (q.type === 'zuordnung') {
            q.terms.forEach(term => {
                let s = `<div class="match-row"><span class="match-term">${term}</span><select class="match-select" data-term="${term}">`;
                q.options.forEach((o, i) => s += `<option value="${i}">${o}</option>`);
                area.innerHTML += s + `</select></div>`;
            });
        }
    }

    function checkAnswer() {
        const q = activeQuestions[currentQIndex]; currentAnswerCorrect = false; let info = "";
        
        if (q.type === 'mc') {
            const sel = document.querySelector('input[name="ans"]:checked'); if(!sel) { alert("Bitte Option wählen!"); return; }
            currentAnswerCorrect = (parseInt(sel.value) === q.a); info = q.options[q.a];
        } else if (q.type === 'tf') {
            const sel = document.querySelector('input[name="ans"]:checked'); if(!sel) { alert("Bitte Option wählen!"); return; }
            currentAnswerCorrect = (sel.value === q.a); info = q.a;
        } else if (q.type === 'text') {
            const val = document.getElementById('txt-ans').value.trim(); if(!val) { alert("Bitte Text eingeben!"); return; }
            const kw = q.a.toLowerCase().replace(/[^a-zäöüß0-9 ]/g, '').split(' ').filter(w => w.length > 3);
            let m = 0; kw.forEach(k => { if(val.toLowerCase().includes(k)) m++; });
            currentAnswerCorrect = (kw.length > 0 && (m / kw.length) >= 0.3) || val.length > 15; info = q.a;
        } else if (q.type === 'luecke') {
            const g0 = document.getElementById('g0').value.trim().toLowerCase();
            const g1 = document.getElementById('g1').value.trim().toLowerCase();
            const g2 = document.getElementById('g2').value.trim().toLowerCase();
            if(!g0 || !g1 || !g2) { alert("Alle Lücken ausfüllen!"); return; }
            currentAnswerCorrect = (g0===q.a[0] && g1===q.a[1] && g2===q.a[2]);
            info = `1: ${q.hints[0]} | 2: ${q.hints[1]} | 3: ${q.hints[2]}`;
        } else if (q.type === 'zuordnung') {
            let ok = true;
            document.querySelectorAll('.match-select').forEach(sel => {
                let v = parseInt(sel.value); if(v === 0 || v !== q.a[sel.dataset.term]) ok = false;
            });
            currentAnswerCorrect = ok; info = "";
            for(let [k,v] of Object.entries(q.a)) info += `• <b>${k}</b> ➔ ${q.options[v]}<br>`;
        }

        handleResult(q.id, currentAnswerCorrect, q.topic);
        updateLiveStats(); showFeedback(info);
    }

    function handleResult(qId, isCorrect, topic) {
        if(isCorrect) {
            score++;
            errorPool = errorPool.filter(id => id !== qId);
        } else {
            wrongAns++;
            if(!errorPool.includes(qId)) errorPool.push(qId);
        }
        
        if(quizMode !== 'error') {
            topicStats[topic].total += 1;
            if(isCorrect) topicStats[topic].correct += 1;
        }

        localStorage.setItem('htl_ErrorPool', JSON.stringify(errorPool));
        localStorage.setItem('htl_TopicStats', JSON.stringify(topicStats));
    }

    function showFeedback(info) {
        document.getElementById('check-btn').classList.add('hidden');
        const area = document.getElementById('feedback-area'), title = document.getElementById('feedback-title'), btn = document.getElementById('override-btn');
        area.classList.remove('hidden');
        
        if(currentAnswerCorrect) {
            title.innerText = "Richtig! ✅"; title.style.color = "var(--correct)"; area.style.borderLeftColor = "var(--correct)"; btn.classList.add('hidden');
        } else {
            title.innerText = "Falsch / Unvollständig ❌"; title.style.color = "var(--wrong)"; area.style.borderLeftColor = "var(--wrong)"; btn.classList.remove('hidden');
        }
        document.getElementById('feedback-text').innerHTML = `<b>Musterlösung:</b><br>${info}`;
    }

    function overrideCorrect() {
        if(!currentAnswerCorrect) {
            const q = activeQuestions[currentQIndex];
            
            score++; wrongAns--; currentAnswerCorrect = true;
            errorPool = errorPool.filter(id => id !== q.id);
            localStorage.setItem('htl_ErrorPool', JSON.stringify(errorPool));

            if(quizMode !== 'error') {
                topicStats[q.topic].correct += 1;
                localStorage.setItem('htl_TopicStats', JSON.stringify(topicStats));
            }

            document.getElementById('feedback-title').innerText = "Manuell als Richtig gewertet! ✅";
            document.getElementById('feedback-title').style.color = "var(--correct)";
            document.getElementById('feedback-area').style.borderLeftColor = "var(--correct)";
            document.getElementById('override-btn').classList.add('hidden');
            updateLiveStats();
        }
    }

    function nextQuestion() {
        currentQIndex++;
        if(currentQIndex < activeQuestions.length) renderQuestion(); else endQuiz();
    }

    function endQuiz() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('end-view').classList.remove('hidden');
        
        const pct = Math.round((score / activeQuestions.length) * 100);
        const grade = getAustrianGrade(pct);
        
        document.getElementById('final-score').innerText = `${score} / ${activeQuestions.length} richtig`;
        document.getElementById('final-pct').innerText = `${pct}%`;
        
        const badge = document.getElementById('final-grade-badge');
        badge.className = `grade-badge grade-${grade}`;
        badge.innerText = `Note: ${grade}`;

        let msg = "";
        if (quizMode === 'test') {
            document.getElementById('end-title').innerText = "Prüfungs-Ergebnis";
            if (grade === 1) msg = "Hervorragend! Meisterhafte Leistung, du hast den Test dominiert. 🥇";
            else if (grade === 2) msg = "Sehr gut! Stabiles Wissen, weiter so. 🥈";
            else if (grade === 3) msg = "War okay, aber da ist definitiv noch Luft nach oben. 🥉";
            else if (grade === 4) msg = "Gerade so durchgekommen. Das war nicht wirklich gut. ⚠️";
            else msg = "War total schlecht. Da musst du noch ordentlich lernen! ❌";
        } 
        else if (quizMode === 'error') {
            document.getElementById('end-title').innerText = "Fehler-Wiederholung beendet";
            msg = `${score} Fehler erfolgreich ausgebessert!`;
            badge.classList.add('hidden');
        } 
        else {
            document.getElementById('end-title').innerText = "Quiz beendet";
            msg = grade <= 2 ? "Starke Leistung! Weiter so." : "Am besten die falschen Fragen gleich im Fehler-Modus wiederholen!";
            badge.classList.remove('hidden');
        }

        document.getElementById('final-message').innerText = msg;
    }

    renderStartScreen();
</script>

</html>
